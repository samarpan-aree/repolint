[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repolint"
version = "1.0.0"
description = "Audit any repository against a professional-repo checklist and get a weighted score."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samarpan Aree" }]
keywords = ["cli", "code-quality", "repository", "audit", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
repolint = "repolint.cli:main"

[project.urls]
Homepage = "https://github.com/samarpan-aree/repolint"
Repository = "https://github.com/samarpan-aree/repolint"
Issues = "https://github.com/samarpan-aree/repolint/issues"

[tool.setuptools.packages.find]
include = ["repolint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["repolint"]
